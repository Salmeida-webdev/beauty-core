name: Docker Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Docker build validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f beauty-core-backend/Dockerfile -t beauty-core-api:test beauty-core-backend
      - name: Validate backend image runtime
        run: docker run --rm beauty-core-api:test node -v
