name: Dependency Security Audit

on:
  push:
    branches:
      - main
      - master
      - develop
      - staging
      - production
  pull_request:
    branches:
      - main
      - master
      - develop
      - staging
      - production
  schedule:
    - cron: "40 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit-production:
    name: npm audit --omit=dev
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Production dependency audit gate
        run: npm audit --omit=dev
