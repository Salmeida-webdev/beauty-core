version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Fortaleza"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
      - "chat40"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      production-dependencies:
        dependency-type: "production"
        patterns:
          - "*"
      development-dependencies:
        dependency-type: "development"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "America/Fortaleza"
    open-pull-requests-limit: 5
    labels:
      - "github-actions"
      - "security"
      - "chat40"
    commit-message:
      prefix: "ci"
      include: "scope"
