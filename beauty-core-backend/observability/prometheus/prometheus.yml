global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          service: prometheus
          environment: development

  - job_name: beauty-core-api
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials: CHANGE_ME_METRICS_TOKEN
    static_configs:
      - targets:
          - host.docker.internal:3000
        labels:
          service: beauty-core-api
          environment: development


